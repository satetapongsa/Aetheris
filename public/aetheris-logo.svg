<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aetheris_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2c3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4d4f74" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1f1f27" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="aetheris_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f27" />
      <stop offset="50%" stop-color="#131319" />
      <stop offset="100%" stop-color="#0e0e12" />
    </linearGradient>
    <linearGradient id="aetheris_core" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e1e1ff" />
      <stop offset="50%" stop-color="#c2c3ee" />
      <stop offset="100%" stop-color="#72749b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#aetheris_bg)" stroke="url(#aetheris_border)" stroke-width="1.2" />
  
  <!-- Geometric Intelligence Node (Neural Glyph) -->
  <g filter="url(#glow)">
    <!-- Central Rhombus Core -->
    <path d="M20 7L27 20L20 33L13 20Z" fill="none" stroke="url(#aetheris_core)" stroke-width="1.6" stroke-linejoin="round" opacity="0.85" />
    <!-- Horizontal Cross Ray -->
    <line x1="8" y1="20" x2="32" y2="20" stroke="url(#aetheris_core)" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
    <!-- Vertical Core Line -->
    <line x1="20" y1="9" x2="20" y2="31" stroke="url(#aetheris_core)" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
    <!-- Center Radiant Node -->
    <circle cx="20" cy="20" r="3.2" fill="url(#aetheris_core)" />
    <circle cx="20" cy="20" r="1.4" fill="#0e0e12" />
    <!-- Peripheral Sub-nodes -->
    <circle cx="20" cy="7" r="1.5" fill="#c2c3ee" />
    <circle cx="20" cy="33" r="1.5" fill="#c2c3ee" />
    <circle cx="13" cy="20" r="1.5" fill="#c2c3ee" />
    <circle cx="27" cy="20" r="1.5" fill="#c2c3ee" />
  </g>
</svg>
